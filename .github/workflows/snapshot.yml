name: daily-snapshot
on:
  schedule: [{cron: "17 11 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: snapshot, cancel-in-progress: false}
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/snapshot.py
      - run: python scripts/build.py
      - name: Commit data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tools.csv
          git diff --cached --quiet || git commit -m "chore: daily pricing snapshot $(date -u +%F)"
          git push
      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
